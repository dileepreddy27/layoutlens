[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layoutlens"
version = "0.1.0"
description = "Coordinate-preserving PDF and OCR table extraction with auditable local reports"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11.10,<0.12", "pandas>=2.2,<3", "Pillow>=12.1,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
layoutlm = ["transformers>=4.50,<5", "torch>=2.6,<3"]
s3 = ["boto3>=1.35,<2"]

[project.scripts]
layoutlens = "layoutlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
